[tool.ruff]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`) codes by default.
select = ["E", "F", "I", "W", "B", "C4", "UP", "N", "Q", "SIM", "ARG", "PIE", "T20", "TCH", "TID", "TCH", "RUF"]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "E722",  # do not use bare except
    "E731",  # do not assign a lambda expression, use a def
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
    "E402",  # module level import not at top of file
    "E731",  # do not assign a lambda expression, use a def
    "F401",  # imported but unused
    "F403",  # wildcard import
    "F405",  # name may be undefined, or defined from star imports
    "F811",  # reimported while unused
    "F821",  # undefined name
    "F822",  # undefined name in __all__
    "F823",  # local variable referenced before assignment
    "F831",  # duplicate argument name in function definition
    "F841",  # local variable is assigned to but never used
    "F842",  # local variable is assigned to but never used
    "F901",  # raise NotImplemented should be NotImplementedError
    "F902",  # invalid syntax
