[tool.ruff]
# Enable pycodestyle (`E`), Pyflakes (`F`), and isort (`I`) codes by default.
select = ["E", "F", "I", "W", "B", "C4", "UP", "N", "Q", "SIM", "ARG", "PIE", "T20", "TCH", "TID", "RUF"]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "E722",  # do not use bare except
    "E731",  # do not assign a lambda expression, use a def
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
    "E402",  # module level import not at top of file
    "F401",  # imported but unused
    "F403",  # wildcard import
    "F405",  # name may be undefined, or defined from star imports
    "F811",  # reimported while unused
    "F821",  # undefined name
    "F822",  # undefined name in __all__
    "F823",  # local variable referenced before assignment
    "F841",  # local variable is assigned to but never used
    "F901",  # raise NotImplemented should be NotImplementedError
    "T201",  # print found (temporarily ignore for debugging)
    "B904",  # Within an `except` clause, raise exceptions with `raise ... from err`
    "ARG001", # Unused function argument
    "ARG002", # Unused method argument
    "N815",  # Variable in class scope should not be mixedCase
    "TID252", # Prefer absolute imports over relative imports
    "TCH002", # Move third-party import into a type-checking block
    "UP035", # `typing.List` is deprecated, use `list` instead
    "UP007", # Use `X | Y` for type annotations
    "RUF013", # PEP 484 prohibits implicit `Optional`
]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.isort]
# Like `isort`, respect the `force_sort_within_sections` setting.
force-sort-within-sections = true

# Like `isort`, order imports by type.
order-by-type = true

# Like `isort`, distinguish between from-import and import statements.
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
