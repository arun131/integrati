name: Frontend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: |
        npm ci

    - name: Create .env file for testing
      run: |
        cat > .env << 'EOF'
        # Frontend test environment variables
        REACT_APP_FIREBASE_API_KEY=test-api-key
        REACT_APP_FIREBASE_AUTH_DOMAIN=test-project.firebaseapp.com
        REACT_APP_FIREBASE_PROJECT_ID=test-project-id
        REACT_APP_FIREBASE_STORAGE_BUCKET=test-project.appspot.com
        REACT_APP_FIREBASE_MESSAGING_SENDER_ID=123456789
        REACT_APP_FIREBASE_APP_ID=1:123456789:web:test123456
        REACT_APP_BACKEND_URL=http://localhost:8000
        REACT_APP_ADMIN_API_KEY=test-admin-api-key
        EOF

    - name: Run linting
      working-directory: ./frontend
      run: npm run lint

    - name: Run tests
      working-directory: ./frontend
      run: npm test -- --coverage --watchAll=false --passWithNoTests

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-test-results
        path: |
          frontend/coverage/
        retention-days: 30
