name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  linting:
    name: Code Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install backend dependencies
      working-directory: ./integrati_backend
      run: |
        python -m pip install --upgrade pip
        pip install ruff==0.12.7

    - name: Lint backend code
      working-directory: ./integrati_backend
      run: |
        python -m ruff check .

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint frontend code
      working-directory: ./frontend
      run: npm run lint

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      CI: true
      TESTING: true
      DATABASE_URL: sqlite:///./test.db
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/callback
      SECRET_KEY: test-secret-key-for-development-only

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y sqlite3

    - name: Install Python dependencies
      working-directory: ./integrati_backend
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-asyncio pytest-cov

    - name: Run unit tests with coverage
      working-directory: ./integrati_backend
      run: |
        python -m pytest tests/unit/ -v --cov=mcp_plexus --cov-report=xml --cov-report=term-missing --cov-fail-under=35

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./integrati_backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Create .env file for testing
      run: |
        cat > .env << 'EOF'
        # Frontend test environment variables
        REACT_APP_FIREBASE_API_KEY=test-api-key
        REACT_APP_FIREBASE_AUTH_DOMAIN=test-project.firebaseapp.com
        REACT_APP_FIREBASE_PROJECT_ID=test-project-id
        REACT_APP_FIREBASE_STORAGE_BUCKET=test-project.appspot.com
        REACT_APP_FIREBASE_MESSAGING_SENDER_ID=123456789
        REACT_APP_FIREBASE_APP_ID=1:123456789:web:test123456
        REACT_APP_BACKEND_URL=http://localhost:8000
        REACT_APP_ADMIN_API_KEY=test-admin-api-key
        EOF

    - name: Run tests
      working-directory: ./frontend
      run: npm test -- --coverage --watchAll=false --passWithNoTests

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false
